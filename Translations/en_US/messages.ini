; plugin / field
mautic.form.field.type.plugin.altcha="ALTCHA"
strings.altcha.plugin.name="ALTCHA"
strings.altcha.failure_message="ALTCHA verification wasn't successful. Please try again."

; integration (Plugins -> ALTCHA) settings
strings.altcha.settings.notice="Fill in EITHER the HMAC Secret (self-hosted, runs entirely on this server) OR the three Sentinel fields below (uses an ALTCHA Sentinel instance to issue challenges and add extra spam/bot protection). If both are filled in, Sentinel is used."

strings.altcha.settings.hmac_secret="HMAC Secret (self-hosted)"
strings.altcha.settings.hmac_secret.notice="This is not an API key - it never leaves your server. Set it to a long, random string (e.g. generate one with `openssl rand -hex 32`) and keep it secret. Mautic uses it to sign and verify challenges locally; ALTCHA never makes an outbound request to any third party. Leave this blank if you're using ALTCHA Sentinel instead. Leaving it blank when editing this form keeps whatever was saved before - it is never echoed back to the browser."
strings.altcha.settings.hmac_secret.placeholder="Leave blank to keep the current secret unchanged"

strings.altcha.settings.sentinel_domain="Sentinel Domain / Base URL"
strings.altcha.settings.sentinel_domain.notice="Your ALTCHA Sentinel instance's base URL, e.g. https://sentinel.example.com (self-hosted) or the URL of your ALTCHA Cloud region. Do not include a trailing slash or path - Mautic appends /v1/challenge itself."

strings.altcha.settings.sentinel_api_key="Sentinel API Key"
strings.altcha.settings.sentinel_api_key.notice="The API Key ID from your Sentinel app's API Keys section (looks like key_...). This is sent to the visitor's browser as part of the widget's challenge URL, so it isn't secret by itself - but it does need to belong to a Security Group that's allowed to issue challenges."

strings.altcha.settings.sentinel_api_secret="Sentinel API Key Secret"
strings.altcha.settings.sentinel_api_secret.notice="The Secret for the same API Key, also shown in Sentinel's API Keys section. Unlike the API Key itself, this never leaves your server - Mautic uses it only to verify the signature Sentinel attaches to each submission, locally, with no outbound request. Leaving it blank when editing this form keeps whatever was saved before."
strings.altcha.settings.sentinel_api_secret.placeholder="Leave blank to keep the current secret unchanged"

; field "Properties" tab settings
strings.altcha.settings.complexity="Complexity"
strings.altcha.settings.complexity.tooltip="Self-hosted mode only (ignored if ALTCHA Sentinel is configured, since Sentinel controls its own difficulty). How much proof-of-work the visitor's browser has to compute before the form can be submitted. Higher complexity means more spam resistance but a slightly slower widget, especially on low-end mobile devices."
strings.altcha.settings.complexity.option.low="Low"
strings.altcha.settings.complexity.option.medium="Medium"
strings.altcha.settings.complexity.option.high="High"

strings.altcha.settings.expire="Challenge expiry (seconds)"
strings.altcha.settings.expire.tooltip="Self-hosted mode only (ignored if ALTCHA Sentinel is configured). How long, in seconds, a generated challenge stays valid for. If a visitor takes longer than this to submit the form, they'll be asked to solve a new challenge."

strings.altcha.settings.auto="Start solving"
strings.altcha.settings.auto.tooltip="When the widget should start solving the challenge automatically. \"On page load\" (recommended) solves the challenge in the background as the visitor reads the form, so submission feels instant. \"On submit\" solves at submit time and then auto-submits the form — avoid this if you want the visitor to click the submit button explicitly. \"Off\" requires the visitor to tick a checkbox."
strings.altcha.settings.auto.option.onload="On page load"
strings.altcha.settings.auto.option.onsubmit="On submit"
strings.altcha.settings.auto.option.off="Off (manual)"

strings.altcha.settings.display="Display mode"
strings.altcha.settings.display.tooltip="How the widget is laid out. \"Standard\" is an inline box; \"Bar\" is a slim bar; \"Floating\" attaches a small badge near the submit button; \"Overlay\" opens a modal only when needed; \"Invisible\" shows no UI at all unless a code challenge is required."
strings.altcha.settings.display.option.standard="Standard (inline box)"
strings.altcha.settings.display.option.bar="Bar"
strings.altcha.settings.display.option.floating="Floating"
strings.altcha.settings.display.option.overlay="Overlay"
strings.altcha.settings.display.option.invisible="Invisible"

strings.altcha.settings.hide_footer="Hide footer"
strings.altcha.settings.hide_logo="Hide ALTCHA logo"

strings.altcha.settings.generate_hmac="Generate random secret"

strings.altcha.settings.script_url="Widget JS URL"
strings.altcha.settings.script_url.notice="URL to load the ALTCHA widget JavaScript from. Leave blank to use the default jsDelivr CDN. Set to a self-hosted or custom URL to avoid loading scripts from a third-party CDN (useful for strict CSP or GDPR environments). Example: https://your-assets.example.com/altcha.js"

; Sentinel live connectivity status (shown in form notes after save)
strings.altcha.settings.sentinel.status.ok="✓ Sentinel is reachable and returning valid challenges. All good."
strings.altcha.settings.sentinel.status.bad_response="⚠ Sentinel responded but the challenge payload looks wrong. Check that the domain and API key are correct."
strings.altcha.settings.sentinel.status.origin_forbidden="✗ Sentinel returned 403 Origin not allowed. Add this site's domain to the allowed origins in your Sentinel Security Group (without trailing slash)."
strings.altcha.settings.sentinel.status.unauthorized="✗ Sentinel returned 401 Unauthorized. The API key may be wrong or the Security Group may be disabled."
strings.altcha.settings.sentinel.status.unreachable="✗ Could not reach the Sentinel challenge endpoint. Check the Sentinel Domain URL and that the server is running."
